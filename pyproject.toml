[project]
name = "tender-risk-agent"
version = "0.1.0"
description = "LangChain-based collusive bidding detection agent design"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "langchain>=0.3.0",
  "langchain-community>=0.3.0",
  "langchain-openai>=0.2.0",
  "langchain-chroma>=0.1.0",
  "langchain-text-splitters>=0.3.0",
  "networkx>=3.2",
  "simhash>=2.1.2",
  "pymupdf>=1.24.0"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
